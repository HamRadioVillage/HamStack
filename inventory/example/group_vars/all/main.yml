hamstack_locale: en_US.UTF-8
hamstack_config_dir: /etc/hamstack
hamstack_data_dir: /var/lib/hamstack
hamstack_cache_dir: /var/cache/hamstack
hamstack_log_dir: /var/log/hamstack
