---
- name: Prepare HamStack conference control station
  when: hamstack_controller_enabled | bool
  block:
    - name: Validate HamStack controller platform
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
          - hamstack_controller_user | length > 0
        fail_msg: >-
          The HamStack controller role supports Debian-family
          systems and requires hamstack_controller_user.

    - name: Read HamStack controller account
      ansible.builtin.getent:
        database: passwd
        key: "{{ hamstack_controller_user }}"

    - name: Derive HamStack controller paths
      ansible.builtin.set_fact:
        _hamstack_controller_home: "{{ ansible_facts.getent_passwd[hamstack_controller_user][4] }}"
        _hamstack_controller_repo: >-
          {{ hamstack_controller_repo_path if hamstack_controller_repo_path | length > 0
             else ansible_facts.getent_passwd[hamstack_controller_user][4] ~ '/hamstack' }}

    - name: Derive HamStack controller virtual environment path
      ansible.builtin.set_fact:
        _hamstack_controller_venv: >-
          {{ hamstack_controller_venv_dir if hamstack_controller_venv_dir | length > 0
             else _hamstack_controller_repo ~ '/.venv' }}

    - name: Install HamStack controller packages
      ansible.builtin.apt:
        name: "{{ hamstack_controller_packages + hamstack_controller_extra_packages }}"
        state: present
        update_cache: true
        cache_valid_time: "{{ hamstack_common_apt_cache_valid_time | default(3600) }}"
      when: hamstack_controller_install_packages | bool

    - name: Verify local HamStack controller tree is present
      ansible.builtin.stat:
        path: "{{ _hamstack_controller_repo }}/requirements-controller.txt"
      register: _hamstack_controller_requirements

    - name: Require an already-provided HamStack controller tree
      ansible.builtin.assert:
        that:
          - _hamstack_controller_requirements.stat.exists
        fail_msg: >-
          HamStack source was not found at {{ _hamstack_controller_repo }}.
          Unpack/copy the HamStack tree there first or set
          hamstack_controller_repo_path. Repository lifecycle is intentionally
          out of scope for this role.

    - name: Create HamStack controller virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ _hamstack_controller_venv }}"
        creates: "{{ _hamstack_controller_venv }}/bin/python"
      become_user: "{{ hamstack_controller_user }}"

    - name: Install HamStack controller Python requirements
      ansible.builtin.pip:
        requirements: "{{ _hamstack_controller_repo }}/requirements-controller.txt"
        virtualenv: "{{ _hamstack_controller_venv }}"
      become_user: "{{ hamstack_controller_user }}"
      when: hamstack_controller_install_python_requirements | bool

    - name: Install HamStack controller Ansible collections
      ansible.builtin.command:
        cmd: >-
          {{ _hamstack_controller_venv }}/bin/ansible-galaxy collection install
          -r {{ _hamstack_controller_repo }}/requirements.yml
          --collections-path {{ _hamstack_controller_home }}/.ansible/collections
      become_user: "{{ hamstack_controller_user }}"
      changed_when: false
      when: hamstack_controller_install_collections | bool
