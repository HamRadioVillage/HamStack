---
- name: Manage FLDIGI
  when: hamstack_fldigi_enabled | bool
  block:
    - name: Verify FLDIGI is running on a supported package platform
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
        fail_msg: >-
          The FLDIGI role supports Debian-family
          systems only.

    - name: Install FLDIGI
      ansible.builtin.apt:
        name: fldigi
        state: present
        update_cache: true
        cache_valid_time: "{{ hamstack_common_apt_cache_valid_time | default(3600) }}"
      when: hamstack_fldigi_install | bool

    - name: Validate operator account for FLDIGI autostart
      ansible.builtin.assert:
        that:
          - hamstack_operator_user | default('') | length > 0
        fail_msg: >-
          Set hamstack_operator_user in this host's host_vars before enabling
          FLDIGI autostart.
      when: hamstack_fldigi_autostart | bool

    - name: Read FLDIGI operator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ hamstack_operator_user }}"
      when: hamstack_operator_user | default('') | length > 0

    - name: Remember FLDIGI operator home directory
      ansible.builtin.set_fact:
        _hamstack_fldigi_operator_home: >-
          {{ ansible_facts.getent_passwd[hamstack_operator_user][4] }}
      when: hamstack_operator_user | default('') | length > 0

    - name: Add FLDIGI operator to radio/audio groups
      ansible.builtin.user:
        name: "{{ hamstack_operator_user }}"
        groups:
          - audio
          - dialout
        append: true
      when: hamstack_operator_user | default('') | length > 0

    - name: Create FLDIGI XDG autostart directory
      ansible.builtin.file:
        path: "{{ _hamstack_fldigi_operator_home }}/.config/autostart"
        state: directory
        owner: "{{ hamstack_operator_user }}"
        mode: "0755"
      when: hamstack_fldigi_autostart | bool

    - name: Configure FLDIGI desktop autostart
      ansible.builtin.template:
        src: "fldigi.desktop.j2"
        dest: "{{ _hamstack_fldigi_operator_home }}/.config/autostart/hamstack-fldigi.desktop"
        owner: "{{ hamstack_operator_user }}"
        mode: "0644"
      when: hamstack_fldigi_autostart | bool

    - name: Remove FLDIGI desktop autostart when disabled
      ansible.builtin.file:
        path: "{{ _hamstack_fldigi_operator_home | default('/nonexistent') }}/.config/autostart/hamstack-fldigi.desktop"
        state: absent
      when:
        - not (hamstack_fldigi_autostart | bool)
        - hamstack_operator_user | default('') | length > 0
