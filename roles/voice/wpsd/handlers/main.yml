---
- name: Refresh WPSD system cache
  ansible.builtin.command:
    cmd: /usr/local/sbin/.wpsd-sys-cache
  changed_when: false
  failed_when: false

- name: Refresh WPSD display driver
  ansible.builtin.command:
    cmd: /usr/local/sbin/.wpsd-display-driver-helper
  changed_when: true

- name: Restart WPSD DMRGateway
  ansible.builtin.service:
    name: dmrgateway
    state: restarted
  when: hamstack_wpsd_restart_on_change | bool

- name: Restart WPSD MMDVMHost
  ansible.builtin.service:
    name: mmdvmhost
    state: restarted
  when: hamstack_wpsd_restart_on_change | bool
