---
- name: Manage FLRIG
  when: hamstack_flrig_enabled | bool
  block:
    - name: Verify FLRIG is running on a supported package platform
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
        fail_msg: >-
          The FLRIG role supports Debian-family
          systems only.

    - name: Install FLRIG
      ansible.builtin.apt:
        name: flrig
        state: present
        update_cache: true
        cache_valid_time: "{{ hamstack_common_apt_cache_valid_time | default(3600) }}"
      when: hamstack_flrig_install | bool

    - name: Read installed FLRIG package version
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - '-f=${Version}'
          - flrig
      register: _hamstack_flrig_installed_version
      changed_when: false
      when: hamstack_flrig_install | bool

    - name: Warn about known Ubuntu 26.04 FLRIG runtime crash
      ansible.builtin.debug:
        msg: >-
          Ubuntu 26.04 currently ships flrig 2.0.05-1build1, which is affected
          by Ubuntu bug 2161172 and can crash immediately on launch. HamStack
          installed the distro package successfully, but runtime QA is blocked
          until Ubuntu publishes the committed fix or the operator supplies a
          newer upstream build.
      when:
        - hamstack_flrig_install | bool
        - ansible_facts['distribution'] == 'Ubuntu'
        - ansible_facts['distribution_release'] == 'resolute'
        - _hamstack_flrig_installed_version.stdout | default('') == '2.0.05-1build1'

    - name: Validate operator account for FLRIG autostart
      ansible.builtin.assert:
        that:
          - hamstack_operator_user | default('') | length > 0
        fail_msg: >-
          Set hamstack_operator_user in this host's host_vars before enabling
          FLRIG autostart.
      when: hamstack_flrig_autostart | bool

    - name: Read FLRIG operator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ hamstack_operator_user }}"
      when: hamstack_operator_user | default('') | length > 0

    - name: Remember FLRIG operator home directory
      ansible.builtin.set_fact:
        _hamstack_flrig_operator_home: >-
          {{ ansible_facts.getent_passwd[hamstack_operator_user][4] }}
      when: hamstack_operator_user | default('') | length > 0

    - name: Add FLRIG operator to radio/audio groups
      ansible.builtin.user:
        name: "{{ hamstack_operator_user }}"
        groups:
          - audio
          - dialout
        append: true
      when: hamstack_operator_user | default('') | length > 0

    - name: Create FLRIG XDG autostart directory
      ansible.builtin.file:
        path: "{{ _hamstack_flrig_operator_home }}/.config/autostart"
        state: directory
        owner: "{{ hamstack_operator_user }}"
        mode: "0755"
      when: hamstack_flrig_autostart | bool

    - name: Configure FLRIG desktop autostart
      ansible.builtin.template:
        src: "flrig.desktop.j2"
        dest: "{{ _hamstack_flrig_operator_home }}/.config/autostart/hamstack-flrig.desktop"
        owner: "{{ hamstack_operator_user }}"
        mode: "0644"
      when: hamstack_flrig_autostart | bool

    - name: Remove FLRIG desktop autostart when disabled
      ansible.builtin.file:
        path: "{{ _hamstack_flrig_operator_home | default('/nonexistent') }}/.config/autostart/hamstack-flrig.desktop"
        state: absent
      when:
        - not (hamstack_flrig_autostart | bool)
        - hamstack_operator_user | default('') | length > 0
