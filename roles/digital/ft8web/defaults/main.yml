---
hamstack_ft8web_enabled: false
hamstack_ft8web_source_url: https://ft8web.ok1cdj.com/
hamstack_ft8web_data_dir: "{{ (hamstack_data_dir | default('/var/lib/hamstack')) ~ '/ft8web' }}"
hamstack_ft8web_refresh: true
hamstack_ft8web_refresh_interval: 6h
hamstack_ft8web_nginx_image: nginx:alpine
hamstack_ft8web_caddy_image: caddy:2-alpine
hamstack_ft8web_https_bind: 0.0.0.0
hamstack_ft8web_https_port: 8448
hamstack_ft8web_tls_host: "{{ inventory_hostname }}"
hamstack_ft8web_tls_extra_names: []
hamstack_ft8web_autostart: true
