---
- name: Deploy Pat Winlink client
  when: hamstack_winlink_enabled | bool
  block:
    - name: Validate Pat/Winlink inputs
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
          - hamstack_winlink_callsign != 'N0CALL'
          - ansible_facts['architecture'] in ['x86_64', 'aarch64', 'arm64', 'armv7l', 'armhf', 'i386', 'i686']
        fail_msg: >-
          Pat requires a real callsign and a supported Debian architecture.

    - name: Map Pat release architecture
      ansible.builtin.set_fact:
        _hamstack_pat_arch: >-
          {% if ansible_facts['architecture'] == 'x86_64' %}amd64
          {% elif ansible_facts['architecture'] in ['aarch64', 'arm64'] %}arm64
          {% elif ansible_facts['architecture'] in ['armv7l', 'armhf'] %}armhf
          {% else %}i386{% endif %}

    - name: Create Pat service group
      ansible.builtin.group:
        name: "{{ hamstack_winlink_group }}"
        system: true
      when: hamstack_winlink_manage_user | bool

    - name: Create Pat service account
      ansible.builtin.user:
        name: "{{ hamstack_winlink_user }}"
        group: "{{ hamstack_winlink_group }}"
        system: true
        create_home: true
        groups:
          - audio
          - dialout
        append: true
        shell: /usr/sbin/nologin
      when: hamstack_winlink_manage_user | bool

    - name: Resolve Pat package checksum
      ansible.builtin.set_fact:
        _hamstack_pat_checksum: "{{ hamstack_winlink_package_checksums.get(_hamstack_pat_arch | trim, '') }}"
        _hamstack_pat_package: "{{ hamstack_winlink_package_cache_dir }}/pat_{{ hamstack_winlink_version }}_{{ _hamstack_pat_arch | trim }}.deb"

    - name: Verify a Pat package checksum is known
      ansible.builtin.assert:
        that:
          - not (hamstack_winlink_require_checksum | bool) or _hamstack_pat_checksum is match('^sha256:[0-9A-Fa-f]{64}$')
        fail_msg: >-
          No sha256 checksum is listed in hamstack_winlink_package_checksums for
          Pat {{ hamstack_winlink_version }} on {{ _hamstack_pat_arch | trim }}.
          Add the upstream release digest, or set
          hamstack_winlink_require_checksum: false to install unverified.

    - name: Create root-owned HamStack package cache
      ansible.builtin.file:
        path: "{{ hamstack_winlink_package_cache_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Pat Debian package
      ansible.builtin.get_url:
        url: >-
          https://github.com/la5nta/pat/releases/download/v{{ hamstack_winlink_version }}/pat_{{ hamstack_winlink_version }}_linux_{{ _hamstack_pat_arch | trim }}.deb
        dest: "{{ _hamstack_pat_package }}"
        checksum: "{{ _hamstack_pat_checksum if _hamstack_pat_checksum | length > 0 else omit }}"
        owner: root
        group: root
        mode: '0644'

    - name: Install Pat Debian package
      ansible.builtin.apt:
        deb: "{{ _hamstack_pat_package }}"
        state: present

    - name: Create Pat persistent directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ hamstack_winlink_user }}"
        group: "{{ hamstack_winlink_group }}"
        mode: '0750'
      loop:
        - "{{ hamstack_winlink_data_dir }}"
        - "{{ hamstack_winlink_data_dir }}/mailbox"

    - name: Render Pat configuration
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ hamstack_winlink_data_dir }}/config.json"
        owner: "{{ hamstack_winlink_user }}"
        group: "{{ hamstack_winlink_group }}"
        mode: '0600'
      no_log: true
      notify: Restart HamStack Winlink

    - name: Install Pat systemd service
      ansible.builtin.template:
        src: hamstack-winlink.service.j2
        dest: /etc/systemd/system/hamstack-winlink.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd for HamStack Winlink
        - Restart HamStack Winlink

    - name: Set Pat service state
      ansible.builtin.systemd:
        name: hamstack-winlink
        enabled: "{{ hamstack_winlink_service_enabled | bool }}"
        state: "{{ 'started' if hamstack_winlink_service_enabled | bool else 'stopped' }}"
        daemon_reload: true
