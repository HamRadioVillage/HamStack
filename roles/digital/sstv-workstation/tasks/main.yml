---
- name: Manage SSTV workstation
  when: hamstack_sstv_workstation_enabled | bool
  block:
    - name: Verify SSTV workstation platform
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - hamstack_sstv_workstation_backend == "qsstv"
        fail_msg: >-
          The SSTV workstation role supports QSSTV on
          Debian-family systems.

    - name: Install HamRadioVillage QSSTV runtime
      ansible.builtin.include_role:
        name: digital/qsstv-runtime
      when: hamstack_sstv_workstation_install | bool

    - name: Validate operator account for QSSTV autostart
      ansible.builtin.assert:
        that:
          - hamstack_sstv_workstation_user | default('') | length > 0
        fail_msg: >-
          Set hamstack_sstv_workstation_user (or hamstack_operator_user) before enabling
          QSSTV autostart.
      when: hamstack_sstv_workstation_autostart | bool

    - name: Read QSSTV operator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ hamstack_sstv_workstation_user }}"
      when: hamstack_sstv_workstation_user | default('') | length > 0

    - name: Remember QSSTV operator home directory
      ansible.builtin.set_fact:
        _hamstack_sstv_workstation_operator_home: >-
          {{ ansible_facts.getent_passwd[hamstack_sstv_workstation_user][4] }}
      when: hamstack_sstv_workstation_user | default('') | length > 0

    - name: Add QSSTV operator to radio/audio groups
      ansible.builtin.user:
        name: "{{ hamstack_sstv_workstation_user }}"
        groups:
          - audio
          - dialout
        append: true
      when: hamstack_sstv_workstation_user | default('') | length > 0

    - name: Create QSSTV XDG autostart directory
      ansible.builtin.file:
        path: "{{ _hamstack_sstv_workstation_operator_home }}/.config/autostart"
        state: directory
        owner: "{{ hamstack_sstv_workstation_user }}"
        mode: "0755"
      when: hamstack_sstv_workstation_autostart | bool

    - name: Configure QSSTV desktop autostart
      ansible.builtin.template:
        src: qsstv.desktop.j2
        dest: "{{ _hamstack_sstv_workstation_operator_home }}/.config/autostart/hamstack-qsstv.desktop"
        owner: "{{ hamstack_sstv_workstation_user }}"
        mode: "0644"
      when: hamstack_sstv_workstation_autostart | bool

    - name: Remove QSSTV desktop autostart when disabled
      ansible.builtin.file:
        path: "{{ _hamstack_sstv_workstation_operator_home | default('/nonexistent') }}/.config/autostart/hamstack-qsstv.desktop"
        state: absent
      when:
        - not (hamstack_sstv_workstation_autostart | bool)
        - hamstack_sstv_workstation_user | default('') | length > 0
