  - python3-venv
  - python3-pip
  - python3-dev
  - build-essential
  - curl
  - jq
  - rsync
  - unzip
  - shellcheck
hamstack_dev_install_python_requirements: true
hamstack_dev_install_collections: true
hamstack_dev_extra_packages: []
