---
- name: Deploy DCDash
  when: hamstack_dcdash_enabled | bool
  block:
    - name: Validate DCDash deployment inputs
      ansible.builtin.assert:
        that:
          - hamstack_dcdash_source_mode == 'git'
          - hamstack_dcdash_source_repo | length > 0
          - vault_hamstack_dcdash_admin_password | default('') | length >= 12
        fail_msg: >-
          DCDash currently expects a git source repository and a Vault-backed
          admin password of at least 12 characters.

    - name: Install DCDash build/runtime prerequisites
      ansible.builtin.apt:
        name:
          - git
          - python3
          - python3-dev
          - python3-venv
          - build-essential
          - libffi-dev
          - libssl-dev
        state: present
        update_cache: true
        cache_valid_time: 3600


    - name: Read DCDash Python version
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
      register: _hamstack_dcdash_python_version
      changed_when: false

    - name: Validate DCDash Python version
      ansible.builtin.assert:
        that:
          - _hamstack_dcdash_python_version.stdout in ['3.11', '3.12']
        fail_msg: >-
          DCDash 2.9 requires Python 3.11 or 3.12; this host reports
          {{ _hamstack_dcdash_python_version.stdout }}.

    - name: Create DCDash service group
      ansible.builtin.group:
        name: "{{ hamstack_dcdash_group }}"
        system: true

    - name: Create DCDash service user
      ansible.builtin.user:
        name: "{{ hamstack_dcdash_user }}"
        group: "{{ hamstack_dcdash_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ hamstack_dcdash_install_dir }}"
        create_home: false

    - name: Create DCDash install directory
      ansible.builtin.file:
        path: "{{ hamstack_dcdash_install_dir }}"
        state: directory
        owner: "{{ hamstack_dcdash_user }}"
        group: "{{ hamstack_dcdash_group }}"
        mode: "0700"

    - name: Check out DCDash source
      ansible.builtin.git:
        repo: "{{ hamstack_dcdash_source_repo }}"
        dest: "{{ hamstack_dcdash_install_dir }}"
        version: "{{ hamstack_dcdash_source_ref }}"
        update: true
        force: false
      register: _hamstack_dcdash_source

    - name: Create DCDash runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ hamstack_dcdash_user }}"
        group: "{{ hamstack_dcdash_group }}"
        mode: "0700"
      loop:
        - "{{ hamstack_dcdash_db_path | dirname }}"
        - "{{ hamstack_dcdash_reports_dir }}"
        - "{{ hamstack_dcdash_backup_dir }}"
        - "{{ hamstack_dcdash_cert_file | dirname }}"
        - "{{ hamstack_dcdash_key_file | dirname }}"

    - name: Install DCDash Python environment
      ansible.builtin.pip:
        name: "{{ hamstack_dcdash_install_dir }}"
        virtualenv: "{{ hamstack_dcdash_install_dir }}/.venv"
        virtualenv_command: "python3 -m venv"
        state: present
      register: _hamstack_dcdash_python

    - name: Correct DCDash source ownership
      ansible.builtin.file:
        path: "{{ hamstack_dcdash_install_dir }}"
        owner: "{{ hamstack_dcdash_user }}"
        group: "{{ hamstack_dcdash_group }}"
        recurse: true

    - name: Render DCDash environment file
      ansible.builtin.template:
        src: dcdash.env.j2
        dest: /etc/default/dcdash
        owner: root
        group: root
        mode: "0600"
      no_log: true
      register: _hamstack_dcdash_env

    - name: Install DCDash systemd unit
      ansible.builtin.template:
        src: dcdash.service.j2
        dest: /etc/systemd/system/dcdash.service
        owner: root
        group: root
        mode: "0644"
      register: _hamstack_dcdash_unit

    - name: Reload systemd for DCDash
      ansible.builtin.systemd:
        daemon_reload: true
      when: _hamstack_dcdash_unit.changed

    - name: Enable and start DCDash
      ansible.builtin.systemd:
        name: dcdash
        enabled: "{{ hamstack_dcdash_autostart | bool }}"
        state: started
      register: _hamstack_dcdash_service

    - name: Restart DCDash after source/config changes
      ansible.builtin.systemd:
        name: dcdash
        state: restarted
      when:
        - hamstack_dcdash_autostart | bool
        - _hamstack_dcdash_source.changed or _hamstack_dcdash_python.changed or _hamstack_dcdash_env.changed or _hamstack_dcdash_unit.changed

    - name: Wait for DCDash health endpoint
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ hamstack_dcdash_port }}/health"
        validate_certs: false
        status_code: 200
      register: _hamstack_dcdash_health
      retries: 10
      delay: 2
      until: _hamstack_dcdash_health.status == 200
      when: hamstack_dcdash_autostart | bool
