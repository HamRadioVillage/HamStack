---
hamstack_gatus_enabled: false
hamstack_gatus_image: ghcr.io/twin/gatus:stable
hamstack_gatus_container_name: hamstack-gatus
hamstack_gatus_caddy_image: caddy:2-alpine
hamstack_gatus_data_dir: "{{ (hamstack_data_dir | default('/var/lib/hamstack')) ~ '/gatus' }}"
hamstack_gatus_https_bind: 0.0.0.0
hamstack_gatus_https_port: 8443
hamstack_gatus_loopback_http_port: 18080
hamstack_gatus_tls_host: "{{ inventory_hostname }}"
hamstack_gatus_interval: 30s
hamstack_gatus_storage: sqlite
hamstack_gatus_auto_node_checks: true
hamstack_gatus_auto_service_checks: true
hamstack_gatus_include_self_check: true
hamstack_gatus_endpoints: []
hamstack_gatus_extra_config: {}
hamstack_gatus_autostart: true
