---
- name: Install JS8Call workstation capability
  when: hamstack_js8call_enabled | bool
  block:
    - name: Validate JS8Call platform
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
          - ansible_facts['architecture'] in ['x86_64', 'aarch64', 'arm64']
          - hamstack_js8call_user | length > 0
        fail_msg: >-
          JS8Call AppImage deployment supports x86_64 and arm64
          Debian-family desktops and requires an operator user.

    - name: Read JS8Call operator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ hamstack_js8call_user }}"

    - name: Read JS8Call operator primary group
      ansible.builtin.command:
        cmd: "id -gn {{ hamstack_js8call_user }}"
      register: _hamstack_js8call_group
      changed_when: false

    - name: Remember JS8Call operator home
      ansible.builtin.set_fact:
        _hamstack_js8call_home: "{{ ansible_facts.getent_passwd[hamstack_js8call_user][4] }}"
        _hamstack_js8call_url: >-
          {{ hamstack_js8call_x86_64_url if ansible_facts['architecture'] == 'x86_64'
             else hamstack_js8call_aarch64_url }}

    - name: Add JS8Call operator to radio/audio groups
      ansible.builtin.user:
        name: "{{ hamstack_js8call_user }}"
        groups:
          - audio
          - dialout
        append: true

    - name: Create JS8Call install directory
      ansible.builtin.file:
        path: "{{ hamstack_js8call_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download JS8Call AppImage
      ansible.builtin.get_url:
        url: "{{ _hamstack_js8call_url }}"
        dest: "{{ hamstack_js8call_install_dir }}/JS8Call.AppImage"
        mode: '0755'

    - name: Create JS8Call application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ hamstack_js8call_user }}"
        group: "{{ _hamstack_js8call_group.stdout }}"
        mode: '0755'
      loop:
        - "{{ _hamstack_js8call_home }}/.local/share/applications"
        - "{{ _hamstack_js8call_home }}/.config/autostart"

    - name: Install JS8Call desktop entry
      ansible.builtin.template:
        src: js8call.desktop.j2
        dest: "{{ _hamstack_js8call_home }}/.local/share/applications/hamstack-js8call.desktop"
        owner: "{{ hamstack_js8call_user }}"
        group: "{{ _hamstack_js8call_group.stdout }}"
        mode: '0644'

    - name: Configure JS8Call desktop autostart
      ansible.builtin.template:
        src: js8call.desktop.j2
        dest: "{{ _hamstack_js8call_home }}/.config/autostart/hamstack-js8call.desktop"
        owner: "{{ hamstack_js8call_user }}"
        group: "{{ _hamstack_js8call_group.stdout }}"
        mode: '0644'
      when: hamstack_js8call_autostart | bool

    - name: Remove JS8Call autostart when disabled
      ansible.builtin.file:
        path: "{{ _hamstack_js8call_home }}/.config/autostart/hamstack-js8call.desktop"
        state: absent
      when: not hamstack_js8call_autostart | bool
